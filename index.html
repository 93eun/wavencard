<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif TC"', '"Cormorant Garamond"', 'Georgia', 'serif'],
            display: ['"Cinzel Decorative"', '"Cormorant Garamond"', 'serif'],
            italicSerif: ['"Cormorant Garamond"', '"Noto Serif TC"', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* 確保跨裝置捲動順暢且不水平溢出 */
    html, body {
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ★ 詩籤級分行排版：完全依照 \n 換行，且防止單行在手機上被意外折斷 ★ */
    .poetic-lines {
      white-space: pre-line;
      word-break: keep-all;
      overflow-wrap: normal;
      line-height: 2.2;
      letter-spacing: 0.08em;
    }

    .reading-title {
      text-wrap: balance;
    }

    /* 古典石版畫紙張紋理 */
    .bg-noise {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* 慕夏香檳金箔漸層字 */
    .mucha-gold-text {
      background: linear-gradient(135deg, #FFF5D6 0%, #D8B467 35%, #B88746 68%, #FBF0C9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 牌卡表面新藝術絲絨反光 */
    .shimmer-sweep {
      background: linear-gradient(110deg, transparent 28%, rgba(235, 197, 125, 0.2) 50%, transparent 72%);
      background-size: 200% 100%;
      transition: background-position 1.1s cubic-bezier(0.19, 1, 0.22, 1);
      background-position: 200% 0;
    }
    .group:hover .shimmer-sweep {
      background-position: -100% 0;
    }

    /* 慕夏畫卷展開動畫 */
    @keyframes mucha-reveal {
      0% {
        opacity: 0;
        transform: perspective(1400px) rotateX(4deg) translateY(20px) scale(0.97);
        filter: blur(6px);
      }
      65% {
        opacity: 1;
        filter: blur(0px);
      }
      100% {
        opacity: 1;
        transform: perspective(1400px) rotateX(0deg) translateY(0px) scale(1);
        filter: blur(0px);
      }
    }
    .animate-mucha-reveal {
      animation: mucha-reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* ==========================================================================
       ★ 極細金線蝕刻 & 微距物理水滴過渡動畫 ★
       ========================================================================== */
    @keyframes arch-draw {
      0% { stroke-dashoffset: 900; opacity: 0; }
      15% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    .animate-arch-draw {
      stroke-dasharray: 900;
      animation: arch-draw 2.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes vine-grow {
      0% { stroke-dashoffset: 500; opacity: 0; }
      25% { opacity: 0.85; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    .animate-vine-grow {
      stroke-dasharray: 500;
      animation: vine-grow 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes petal-bloom {
      0% { transform: scale(0.3) rotate(-15deg); opacity: 0; }
      50% { opacity: 0.95; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .animate-petal-bloom {
      transform-origin: 130px 118px;
      animation: petal-bloom 2.4s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
      opacity: 0;
    }

    /* ★ 1. 花蕊尖端母液滴蓄力（表面張力膨脹 -> 滴落收縮） ★ */
    @keyframes meniscus-swell {
      0%, 10% { transform: scale(0.2); opacity: 0.2; }
      28% { transform: scale(1.15, 1.35); opacity: 1; }
      38% { transform: scale(0.4, 0.6); opacity: 0.5; }
      100% { transform: scale(0.2); opacity: 0.2; }
    }
    .animate-meniscus {
      transform-origin: 130px 124px;
      animation: meniscus-swell 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* ★ 2. 主黃金水滴：凝聚拉伸 -> 重力加速下墜 -> 觸水壓平融合 ★ */
    @keyframes macro-drop-fall {
      0%, 16% {
        transform: translateY(0px) scale(0.15, 0.15);
        opacity: 0;
      }
      28% {
        transform: translateY(2px) scale(0.88, 1.12);
        opacity: 1;
      }
      36% {
        transform: translateY(6px) scale(0.95, 1.18);
        opacity: 1;
      }
      66% {
        transform: translateY(58px) scale(0.92, 1.22);
        opacity: 1;
      }
      71% {
        transform: translateY(64px) scale(1.45, 0.35);
        opacity: 0.85;
      }
      76%, 100% {
        transform: translateY(66px) scale(1.8, 0.1);
        opacity: 0;
      }
    }
    .animate-macro-drop {
      transform-origin: 130px 128px;
      animation: macro-drop-fall 2.4s cubic-bezier(0.55, 0.05, 0.68, 0.19) infinite;
    }

    /* ★ 3. 伴生微珠 (Satellite Micro-bead)：跟隨在主水滴後方的微小金珠 ★ */
    @keyframes satellite-drop-fall {
      0%, 30% {
        transform: translateY(0px) scale(0);
        opacity: 0;
      }
      38% {
        transform: translateY(4px) scale(1);
        opacity: 0.9;
      }
      70% {
        transform: translateY(62px) scale(0.8);
        opacity: 0.85;
      }
      76%, 100% {
        transform: translateY(66px) scale(0);
        opacity: 0;
      }
    }
    .animate-satellite-drop {
      transform-origin: 130px 126px;
      animation: satellite-drop-fall 2.4s cubic-bezier(0.55, 0.05, 0.68, 0.19) infinite;
    }

    /* ★ 4. 滴落瞬間的王冠反彈微珠 (Crown Splash) ★ */
    @keyframes crown-splash {
      0%, 67% {
        transform: translateY(0px) scale(0);
        opacity: 0;
      }
      74% {
        transform: translateY(-9px) scale(1);
        opacity: 0.95;
      }
      84% {
        transform: translateY(-2px) scale(0.75);
        opacity: 0.6;
      }
      90%, 100% {
        transform: translateY(2px) scale(0);
        opacity: 0;
      }
    }
    .animate-crown-splash {
      transform-origin: 130px 192px;
      animation: crown-splash 2.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    /* ★ 5. 聖杯三層極細金色水波紋擴散 ★ */
    @keyframes chalice-ripple {
      0%, 66% { transform: scale(0.15); opacity: 0; }
      72% { opacity: 0.95; }
      100% { transform: scale(1.95); opacity: 0; }
    }
    .animate-ripple-1 {
      transform-origin: 130px 192px;
      animation: chalice-ripple 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    .animate-ripple-2 {
      transform-origin: 130px 192px;
      animation: chalice-ripple 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0.16s infinite;
    }
    .animate-ripple-3 {
      transform-origin: 130px 192px;
      animation: chalice-ripple 2.4s cubic-bezier(0.16, 1, 0.3, 1) 0.32s infinite;
    }

    @keyframes slow-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes slow-spin-reverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    .animate-halo-spin { animation: slow-spin 48s linear infinite; }
    .animate-halo-reverse { animation: slow-spin-reverse 36s linear infinite; }

    @keyframes star-twinkle {
      0%, 100% { transform: scale(0.75); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.95; }
    }
    .animate-twinkle-1 { animation: star-twinkle 3s ease-in-out infinite; }
    .animate-twinkle-2 { animation: star-twinkle 3.8s ease-in-out infinite 1.2s; }
    .animate-twinkle-3 { animation: star-twinkle 3.4s ease-in-out infinite 2.1s; }

    @keyframes progress-fill {
      0% { width: 0%; opacity: 0.4; }
      50% { opacity: 1; }
      100% { width: 100%; opacity: 0.95; }
    }
    .animate-progress-gold {
      animation: progress-fill 3.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fade-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="m-0 p-0 selection:bg-amber-500/30 selection:text-amber-100">

    const { useState, useEffect, useRef } = React;

    // ============================================================================

              {/* 1. 慕夏極細三層拱門畫框 */}

    const shuffleCards = (array) => {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    const getCategoryMeta = (category) => {
      switch (category) {

          return { title: '果香調 · Citrus', note: '前調 Top Note · 輕盈閃耀的晨光分子', scentHint: '清脆微酸的果皮精油香氣正在腦海中跳躍...' };
        case 'herb': 
          return { title: '草本與葉片 · Herb & Leaf', note: '中調 Heart Note · 穿透胸腔的翠綠微風', scentHint: '揉碎新鮮葉片般的清透草本香氣正緩緩散開...' };
        case 'flower': 
          return { title: '花香調 · Floral', note: '中後調 Heart Note · 溫柔包覆的花瓣吐息', scentHint: '微風拂過花瓣的馥郁芬芳正輕柔地繚繞鼻息...' };

          case 'citrus': return 'from-[#FFFDF8] via-[#FCF4E1] to-[#F3E5C8] border-amber-700/40 text-stone-800 shadow-[0_20px_60px_rgba(180,83,9,0.12)]';

    function WavenOracle() {
      const [dailyCards, setDailyCards] = useState([]);
      const [currentCard, setCurrentCard] = useState(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [showShadow, setShowShadow] = useState(false); 
      const [breathingStep, setBreathingStep] = useState('');
      const [isNordic, setIsNordic] = useState(false);
      const [history, setHistory] = useState([]);
      const [showHistory, setShowHistory] = useState(false);
      const [copied, setCopied] = useState(false);

      const timersRef = useRef([]);

      const clearAllTimers = () => {
        timersRef.current.forEach(t => clearTimeout(t));
        timersRef.current = [];
      };

      const initCards = () => {
        clearAllTimers();
        const shuffled = shuffleCards(oilsData);
        setDailyCards(shuffled.slice(0, 3));
        setCurrentCard(null);
        setIsDrawing(false);
        setBreathingStep('');
        setShowShadow(false);
        setCopied(false);
      };

      useEffect(() => {
        initCards();
        try {
          const savedHistory = window.localStorage.getItem('waven_oracle_history');
          if (savedHistory) {
            const parsed = JSON.parse(savedHistory);
            if (Array.isArray(parsed)) setHistory(parsed);
          }
        } catch (e) {}
        return () => clearAllTimers();
      }, []);

      const saveToHistory = (card) => {
        const now = new Date();
        const timeStr = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        const newRecord = { ...card, drawTime: timeStr, recordId: Date.now() };
        setHistory(prev => {
          const updated = [newRecord, ...prev].slice(0, 15);
          try { window.localStorage.setItem('waven_oracle_history', JSON.stringify(updated)); } catch (e) {}
          return updated;
        });
      };

      const pickCard = (index) => {
        if (isDrawing || !dailyCards[index]) return;
        clearAllTimers();
        setIsDrawing(true);
        setCurrentCard(null);
        setShowShadow(false); 
        setCopied(false);
        
        const selected = dailyCards[index];
        
        setBreathingStep('prepare');
        const t1 = setTimeout(() => setBreathingStep('inhale'), 1150);
        const t2 = setTimeout(() => setBreathingStep('exhale'), 2350);
        const t3 = setTimeout(() => {
          setCurrentCard(selected);
          saveToHistory(selected);
          setIsDrawing(false);
          setBreathingStep('');
        }, 3600);
        
        timersRef.current.push(t1, t2, t3);
      };

      const fallbackCopy = (text, callback) => {
        try {
          const textArea = document.createElement("textarea");
          textArea.value = text;
          textArea.style.position = "fixed";
          textArea.style.left = "-9999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          document.body.removeChild(textArea);
          callback();
        } catch (e) {}
      };

      const copyCardReading = () => {
        if (!currentCard) return;
        const text = `【WAVEN 慕夏植物香氣指引】\n🌿 ${currentCard.name} (${currentCard.enName})\n\n✨ 能量指引：\n${currentCard.energy}\n\n💧 陰影覺察：\n${currentCard.shadow}\n\n🧪 香氣共鳴配方：\n${currentCard.blend}\n\n—— Follow your inner light · WAVEN`;
        const handleSuccess = () => {
          setCopied(true);
          const t = setTimeout(() => setCopied(false), 2500);
          timersRef.current.push(t);
        };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(handleSuccess).catch(() => fallbackCopy(text, handleSuccess));
        } else {
          fallbackCopy(text, handleSuccess);
        }
      };

      const cardBacks = [
        { 
          roman: "I",
          type: "sun",
          label: "日 · 覺醒",
          fanClass: "-rotate-2 translate-y-1.5 hover:rotate-0 hover:-translate-y-2.5"
        },
        { 
          roman: "II",
          type: "moon",
          label: "月 · 靜心",
          fanClass: "rotate-0 hover:-translate-y-3"
        },
        { 
          roman: "III",
          type: "star",
          label: "星 · 指引",
          fanClass: "rotate-2 translate-y-1.5 hover:rotate-0 hover:-translate-y-2.5"
        }
      ];

      return (
        <div className={`min-h-[100dvh] font-serif flex flex-col items-center justify-between py-6 px-3.5 relative overflow-x-hidden transition-colors duration-1000 ${
          isNordic ? 'bg-[#F3ECE0] text-stone-800' : 'bg-[#070503] text-amber-50'
        }`}>
          
          {/* 背景慕夏畫布光暈與石版畫紋理 */}
          {!isNordic ? (
            <>
              <div className="fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#22160a] via-[#090604] to-[#030201] opacity-95 pointer-events-none"></div>
              <div className="fixed inset-0 bg-noise opacity-[0.045] pointer-events-none"></div>
              <div className="fixed -top-24 left-1/2 -translate-x-1/2 w-[500px] h-[320px] bg-amber-600/10 rounded-full filter blur-[120px] pointer-events-none"></div>
            </>
          ) : (
            <>
              <div className="fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#FFFDF9] via-[#F3ECE0] to-[#E2D6C1] opacity-95 pointer-events-none"></div>

            </main>

          </div>

          {/* 香籤簿（個人歷史紀錄抽屜） */}
          {showHistory && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/65 backdrop-blur-sm animate-fade-in">
              <div className={`w-full max-w-[360px] h-full p-6 flex flex-col justify-between overflow-y-auto border-l shadow-2xl ${
                isNordic ? 'bg-[#FAF6EE] border-stone-300 text-stone-800' : 'bg-[#0d0906] border-amber-500/25 text-amber-50'
              }`}>
                <div className="space-y-5">
                  <div className={`flex items-center justify-between pb-4 border-b ${isNordic ? 'border-stone-200' : 'border-amber-500/20'}`}>
                    <div>
                      <div className="flex items-center gap-2 tracking-[0.2em] text-base">
                        <History className="w-4 h-4" />
                        <span>個人香籤簿</span>
                      </div>
                      <p className={`text-[10px] mt-1 ${isNordic ? 'text-stone-400' : 'text-amber-500/40'}`}>
                        紀錄僅保存於您的瀏覽器中，完全私密
                      </p>
                    </div>
                    <button onClick={() => setShowHistory(false)} className="p-1.5 rounded-full hover:bg-stone-500/10">
                      <X className="w-5 h-5" />
                    </button>
                  </div>

                  {history.length === 0 ? (
                    <p className={`text-center py-12 text-xs tracking-widest ${isNordic ? 'text-stone-400' : 'text-amber-500/40'}`}>
                      尚無抽牌紀錄，開始今日的第一次香氣連結吧
                    </p>
                  ) : (
                    <div className="space-y-3">
                      {history.map((item) => (
                        <button
                          key={item.recordId}
                          onClick={() => {
                            setCurrentCard(item);
                            setShowShadow(false);
                            setShowHistory(false);
                          }}
                          className={`w-full text-left p-4 rounded-xl border transition-all flex items-center justify-between ${
                            isNordic 
                              ? 'bg-white border-stone-200/90 hover:border-amber-700/50 shadow-sm' 
                              : 'bg-[#16100a] border-amber-500/20 hover:border-amber-400/50'
                          }`}
                        >
                          <div className="pr-2 min-w-0">
                            <div className="flex items-center gap-2">
                              <span className="text-base font-medium tracking-wider shrink-0">{item.name}</span>
                              <span className={`text-[10px] font-italicSerif italic truncate ${isNordic ? 'text-stone-400' : 'text-amber-300/50'}`}>
                                {item.enName}
                              </span>
                            </div>
                            <p className={`text-xs mt-1 truncate ${isNordic ? 'text-stone-500' : 'text-amber-100/60'}`}>
                              {item.blend}
                            </p>
                          </div>
                          <span className={`text-[10px] font-mono shrink-0 ${isNordic ? 'text-stone-400' : 'text-amber-500/40'}`}>
                            {item.drawTime}
                          </span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                {history.length > 0 && (
                  <button
                    onClick={() => {
                      setHistory([]);
                      try { window.localStorage.removeItem('waven_oracle_history'); } catch (e) {}
                    }}
                    className={`mt-6 w-full py-2.5 text-xs tracking-widest border rounded-lg transition-colors ${
                      isNordic 
                        ? 'border-stone-300 text-stone-500 hover:text-stone-800 hover:bg-stone-200/50' 
                        : 'border-amber-500/20 text-amber-500/50 hover:text-amber-300 hover:bg-amber-950/30'
                    }`}
                  >
                    清空本機香籤紀錄
                  </button>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WavenOracle />);
  </script>
</body>
</html>
