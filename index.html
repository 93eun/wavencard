      "9|甜馬鬱蘭|Sweet Marjoram|herb|代表著平衡、陪伴與內在的安寧。\n厚實的草本香氣像一個溫暖的擁抱，\n能填補內心的空缺，\n安撫奔波疲憊的靈魂，\n帶給你深層的休息。|因害怕寂寞而緊抓著不適合的關係，\n或身心已經極度疲憊。\n甜馬鬱蘭能療癒心輪的劇痛與孤獨感，\n找回與自己相處的平靜。|【靜夜安神】甜馬鬱蘭 ＋ 羅馬洋甘菊 ＋ 甜橙|注意：放鬆副交感神經效果強，開車或需高度專注時請勿使用。",
      "10|玫瑰草|Palmarosa|herb|代表著柔韌、適應與隨遇而安。\n兼具草本與花香的特質，\n象徵著水的智慧，能軟化僵硬的原則，\n讓愛與能量重新順暢流動，以柔克剛。|因過度固執，\n或想掌控一切而感到心累。\n玫瑰草能幫助你軟化僵硬的心防，\n溫柔地適應環境的每一個變化。|【柔韌心流】玫瑰草 ＋ 花梨木 ＋ 乳香|安全：性質相當溫和親膚，適合大多數膚質日常保養。",

      "22|快樂鼠尾草|Clary Sage|herb|代表著直覺、靈感與打破框架。\n帶有微醺麝香調的草本氣息，\n能鬆動過度緊繃的理性大腦，\n引領你進入潛意識的花園，\n看見意想不到的創造力與可能性。|太習慣用大腦分析一切，\n卻忽略了身體與直覺的聲音。\n快樂鼠尾草能帶你放下過度的控制，\n在微醺般的放鬆中找回靈感。|【微醺靈感】快樂鼠尾草 ＋ 波旁天竺葵 ＋ 葡萄柚|注意：使用前後請勿飲酒（易加深醉意）；孕婦及乳腺相關病史者請避開。",
      "26|綠花白千層|Niaouli|herb|代表著淨化、強化與清晰的防禦。\n帶有穿透力卻比茶樹更圓潤的葉片香，\n能掃除心智的混濁與疲態，\n在混亂的外在環境中，\n為你撐起一片乾淨透明的保護傘。|近期或許覺得外界干擾太多，\n能量場變得雜亂而容易疲倦。\n綠花白千層能幫你過濾掉不必要的消耗，\n讓身心回到清明且受保護的狀態。|【清透防護】綠花白千層 ＋ 薄荷 ＋ 檸檬|注意：具有輕微類雌激素特性，孕婦與幼童建議謹慎低劑量使用。",
      "27|甜茴香|Sweet Fennel|herb|代表著消化、表達與落實的勇氣。\n帶著八角般溫潤甘甜的草本香料氣息，\n能幫助你消化龐雜的資訊與情緒，\n將積壓在心口的話語，\n溫柔而順暢地釋放出來。|總是把委屈或想法吞進肚子裡，\n或是想得太多卻無法化為實際行動。\n甜茴香能溫暖緊縮的腹部與心房，\n支持你勇敢表達真實的感受。|【溫暖梳理】甜茴香 ＋ 甜橙 ＋ 薑|禁忌：含反式洋茴香腦，孕婦、哺乳期、幼童及雌激素相關病史者請避免使用。",
      "28|月桂|Bay Laurel|herb|代表著榮耀、突破與跨越自我懷疑。\n揉合了果香、辛香與葉片香的豐富層次，\n如同古希臘象徵勝利的桂冠，\n能為你注入肯定自我的底氣，\n勇敢站上屬於你的舞台。|明明已經準備好了，\n卻因為冒牌者症候群而不敢展現自己。\n月桂能驅散內在的膽怯與猶豫，\n讓你抬起頭，看見自己走過的路有多閃耀。|【桂冠加冕】月桂 ＋ 佛手柑 ＋ 黑雲杉|刺激性：可能引起少數人皮膚敏感，務必低劑量稀釋後使用，孕婦避開。",

      "42|杜松|Juniper Berry|wood|代表著淨化、排解與心靈的斷捨離。\n清冽乾淨的漿果木質香，\n是極佳的「能量清道夫」，\n能洗滌沾染在身上的負面情緒與濁氣，\n讓身心重回如山泉水般的清澈。|吸收了太多他人的抱怨與負能量，\n卻不知道該如何排解，感到沉重黏膩。\n杜松能幫你把不屬於你的情緒垃圾清理乾淨，\n守住內在的清明。|【山泉淨化】杜松 ＋ 絲柏 ＋ 檸檬|禁忌：孕婦及嚴重腎臟疾病患者請避免使用。",
      "43|花梨木|Rosewood|wood|代表著溫潤、無私的接納與歲月靜好。\n同時擁有木質的沉穩與花朵的甜美，\n不張揚卻極具包容力，\n能溫柔地撫平內在的稜角與焦躁，\n讓你感受到被生命穩穩托住的安心。|對自己或身邊的人太過嚴苛，\n在緊繃的標準中失去了生活的溫度。\n花梨木能軟化僵硬的心態，\n找回隨順因緣的溫柔與從容。|【溫潤歲月】花梨木 ＋ 波旁天竺葵 ＋ 甜橙|永續提醒：性質極為溫和親膚；選購時建議挑選具合法永續認證之來源。",
      "44|穗甘松|Spikenard|wood|代表著臣服、寬恕與靈魂的安息。\n生長於喜馬拉雅高海拔的古老根部精油，\n帶著深邃厚重的泥土與麝香調，\n能將極度飄忽或焦慮的心神穩穩拉回地面，\n帶來最深層的臣服與和解。|心底還抓著某個無法原諒的人事物，\n或是對未知的變化充滿恐懼。\n穗甘松能陪你放下緊抓不放的控制欲，\n在徹底的釋懷中獲得真正的自由。|【喜馬拉雅靜心】穗甘松 ＋ 乳香 ＋ 真正薰衣草|安全：鎮靜與扎根效果極強，適合於夜晚、冥想或睡前靜心時使用。",
      "45|黑胡椒|Black Pepper|wood|代表著點燃、果敢與突破框架的動能。\n乾燥溫暖的辛香氣息，\n能瞬間活絡停滯冰冷的能量場，\n為耐力不足的時刻注入強心針，\n推著你把心裡的藍圖化為真實。|陷入拖延與反覆猶豫的迴圈，\n心裡有很多計畫卻遲遲沒有動力執行。\n黑胡椒能點燃內在的生命之火，\n給你直接付諸行動的爽快魄力。|【熱情點燃】黑胡椒 ＋ 甜橙 ＋ 廣藿香|刺激性：對皮膚具溫熱刺激感，塗抹務必低濃度稀釋（1% 以下）。",
      "46|纈草|Valerian|wood|代表著徹底關機、深沉安眠與卸下武裝。\n極為獨特且深沉的古老根部氣息，\n是自然界最強大的「休止符」，\n能強制讓過度緊繃的神經系統，\n進入最深層的修復與沉睡。|就算躺在床上，腦袋依然像跑馬燈轉個不停，\n連睡夢中都還在擔心明天的事。\n纈草能幫你拔掉焦慮的電源線，\n讓身心真正地墜入安穩的睡眠。|【深眠休止符】纈草 ＋ 甜馬鬱蘭 ＋ 甜橙|氣味與注意：氣味十分濃烈特殊（帶有發酵木質調），極少量與柑橘調合即可；開車前嚴禁使用。",
      "47|丁香|Clove Bud|wood|代表著界線、熱情與不再委曲求全。\n濃烈溫暖的辛香調具有強大的防護力，\n能驅散心靈的寒意與受害者情結，\n支持你勇敢說出「不」，\n拿回屬於自己的人生主導權。|習慣討好他人、害怕衝突，\n在關係裡總是退讓到沒有自己的空間。\n丁香能為你注入火元素般的底氣，\n堅定地守住自己的核心原則。|【溫暖底氣】丁香 ＋ 甜橙 ＋ 薑|強刺激性：含高比例丁香酚，塗抹肌膚務必極低濃度稀釋（0.5% 以下），孕婦與幼童避開。",
      "48|膠冷杉|Balsam Fir|wood|代表著純淨、希望與冬日裡的溫暖庇護。\n帶著淡淡果香與樹脂甜味的針葉氣息，\n宛如走進陽光明媚的北方白雪森林，\n能溫柔洗滌疲憊的呼吸，\n帶來平靜而充滿希望的視野。|在日復一日的瑣事中感到視野狹隘，\n心靈像是被關在狹小的房間裡。\n膠冷杉能為你打開一扇通往森林的窗，\n讓清新寬廣的能量重新流進心底。|【北國森林】膠冷杉 ＋ 大西洋雪松 ＋ 佛手柑|安全：針葉類中性質非常溫和的品種，適合日常空間擴香與呼吸照護。",
      "49|黑雲杉|Black Spruce|wood|代表著回充、韌性與深層的底氣。\n沉穩卻又帶著清新空氣感的森林香氣，\n能深入支持長期透支的能量核心，\n在你覺得快要撐不下去的時候，\n成為你最安穩、最堅實的後盾。|長期靠著意志力硬撐，\n明明身體已經發出疲憊訊號卻不敢停下來。\n黑雲杉能溫和地為你補充電力，\n讓你明白休息是為了走更長遠的路。|【森林後盾】黑雲杉 ＋ 澳洲尤加利 ＋ 桉油醇迷迭香|注意：請選擇新鮮未氧化的精油，並稀釋後使用。",
      "50|肉桂|Cinnamon Bark / Leaf|wood|代表著生命之火、熱情與創造的喜悅。\n熾熱而甜美的辛香氣息，\n能瞬間融化冷漠、孤寂與心灰意冷，\n重新點燃對生活的渴望與愛火，\n讓你感受到活在當下的溫熱與真實。|對生活失去了期待感，\n把心封閉在安全卻冰冷的舒適圈裡。\n肉桂能像冬日壁爐裡的火光般溫暖你，\n喚醒沉睡已久的生命熱情。|【壁爐暖火】肉桂 ＋ 甜橙 ＋ 乳香|極強刺激性：肉桂皮含高比例肉桂醛，建議僅作極低劑量擴香；若需塗抹請選肉桂葉並稀釋至 0.5% 以下，孕婦禁用。",
      "51|安息香|Benzoin|wood|代表著甜美的呵護、安全感與柔軟的包覆。\n帶有香草冰淇淋般溫暖甜潤的樹脂香，\n能瞬間融化內心的孤單與防備，\n像一條柔軟的毛毯緊緊包裹住你，\n帶來無邊無際的寵愛與安心。|在堅強的外表下，\n其實非常渴望被理解、被好好地擁抱。\n安息香能溫柔地填補心靈的空洞，\n讓你卸下所有的逞強，安心地依靠。|【香草毛毯】安息香 ＋ 波旁天竺葵 ＋ 甜橙|質地提醒：質地極為濃稠，使用時可先以溫水隔水溫熱瓶身，或調入植物油中使用。"

                <path d="M130 264C108 264 84 250 74 228C88 230 104 240 112 246M130 264C152 264 176 250 186 228C172 230 156 240 148 246" fill={fl} strokeWidth=".7"/>
                <path d="M130 250C110 246 92 232 86 212C98 218 110 230 118 240M130 250C150 246 168 232 174 212C162 218 150 230 142 240" fill={fl} strokeWidth=".55"/>
                <path d="M96 278C110 268 150 268 164 278Z" fill={fl} strokeWidth=".75"/>
                <line x1="76" y1="282" x2="184" y2="282" strokeWidth=".65"/>
                <polygon points="130,278 133,282 130,286 127,282" fill={g2}/>
              </g>
              <line x1="130" y1="126" x2="130" y2="192" stroke="url(#gL)" strokeWidth=".25" strokeDasharray="1 2.5" opacity=".45"/>
              <path className="a-swell" d="M127.5 124Q130 129.5 132.5 124Z" fill="url(#dG)" stroke={g2} strokeWidth=".35"/>
              <g className="a-sat"><circle cx="130" cy="126" r="1.1" fill={g2}/><circle cx="129.6" cy="125.6" r=".35" fill="#FFF"/></g>
              <g className="a-drop"><path d="M130 121C130 121 124.8 129.2 124.8 133A5.2 5.2 0 1 0 135.2 133C135.2 129.2 130 121 130 121Z" fill="url(#dG)" stroke={g2} strokeWidth=".55"/><path d="M128.2 126.5C126.6 129.2 126.3 132 127.2 134.5" stroke="#FFF" strokeWidth=".65" strokeLinecap="round"/><circle cx="131.8" cy="135.2" r=".65" fill="#FFF"/></g>
              <g className="a-splash" stroke={g2} fill={g2}><circle cx="130" cy="188" r="1.15"/><circle cx="122" cy="190" r=".75"/><circle cx="138" cy="190" r=".75"/></g>
              <ellipse cx="130" cy="192" rx="22" ry="3.8" stroke={g2} strokeWidth=".55" className="a-rip1"/><ellipse cx="130" cy="192" rx="15" ry="2.6" stroke={g1} strokeWidth=".4" className="a-rip2"/><ellipse cx="130" cy="192" rx="8" ry="1.4" stroke={g2} strokeWidth=".3" className="a-rip3"/>
            </svg>
          </div>
          <div className="space-y-4 w-full text-center mt-2 px-2">
            <p key={step} className={`text-[15px] tracking-[0.16em] a-fade ${lt?'text-stone-800 font-medium':'gold-txt'}`}>
              {step==='prepare'&&'\u9589\u4e0a\u96d9\u773c\uff0c\u51dd\u795e\u975c\u6c23...'}
              {step==='inhale'&&'\u6df1\u5438\u4e00\u53e3\u6c23\uff0c\u611f\u53d7\u690d\u7269\u7cbe\u8403\u7de9\u7de9\u51dd\u805a...'}
              {step==='exhale'&&'\u7de9\u7de9\u5410\u6c23\uff0c\u8b93\u9999\u6c23\u5728\u8166\u6d77\u4e2d\u6e05\u6f88\u7dbb\u653e...'}
            </p>
            <div className={`w-48 h-[1px] mx-auto rounded-full overflow-hidden ${lt?'bg-amber-900/15':'bg-amber-500/15'}`}><div className={`h-full a-prog ${lt?'bg-amber-700':'bg-amber-300'}`}/></div>
            <p className={`text-[9px] font-display tracking-[0.42em] uppercase ${lt?'text-amber-900/50':'text-amber-400/55'}`}>Sacred Botanical Distillation</p>
          </div>
        </div>
      );
    };

    const Medallion = ({ cat, lt }) => {
      const P = {
        citrus:{p:lt?'#B45309':'#FBBF24',s:lt?'#D97706':'#FEF08A',f:'rgba(251,191,36,.11)'},
        herb:{p:lt?'#047857':'#34D399',s:lt?'#10B981':'#A7F3D0',f:'rgba(16,185,129,.11)'},
        flower:{p:lt?'#BE123C':'#FB7185',s:lt?'#F43F5E':'#FECDD3',f:'rgba(244,63,94,.11)'},
        wood:{p:lt?'#92400E':'#F59E0B',s:lt?'#B45309':'#FDE68A',f:'rgba(217,119,6,.11)'}
      }[cat];
      return (
        <div className="relative w-[220px] h-[220px] shrink-0 mx-auto my-1 flex items-center justify-center select-none">
          <svg viewBox="0 0 220 220" fill="none" className="w-full h-full overflow-visible">
            <defs><linearGradient id={`g-${cat}`} x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor={P.s}/><stop offset="50%" stopColor={P.p}/><stop offset="100%" stopColor={P.s}/></linearGradient></defs>
            <g className="a-spin" style={{transformOrigin:'110px 115px'}}>
              <circle cx="110" cy="115" r="84" stroke={`url(#g-${cat})`} strokeWidth=".8"/><circle cx="110" cy="115" r="76" stroke={P.p} strokeWidth="2.2" strokeDasharray="1 3.5" opacity=".5"/><circle cx="110" cy="115" r="70" stroke={`url(#g-${cat})`} strokeWidth=".45"/>
              {Array.from({length:36}).map((_,i)=><line key={i} x1="110" y1={i%3===0?31:35} x2="110" y2="42" stroke={P.p} strokeWidth={i%3===0?".6":".3"} opacity=".6" transform={`rotate(${i*10} 110 115)`}/>)}
            </g>
            <g className="a-rspin" style={{transformOrigin:'110px 115px'}}>
              <circle cx="110" cy="115" r="56" stroke={P.p} strokeWidth=".4" opacity=".5"/>
              <polygon points="110,54 123,97 166,115 123,133 110,176 97,133 54,115 97,97" stroke={P.p} strokeWidth=".45" fill={P.f} opacity=".5"/>
              <polygon points="110,54 123,97 166,115 123,133 110,176 97,133 54,115 97,97" stroke={P.p} strokeWidth=".35" opacity=".35" transform="rotate(45 110 115)"/>
            </g>
            <g stroke={`url(#g-${cat})`} strokeLinecap="round" strokeLinejoin="round">
              {cat==='citrus'&&<><path d="M64 166C64 120 88 94 110 66C132 94 156 120 156 166" strokeWidth=".85"/><line x1="110" y1="66" x2="110" y2="158" strokeWidth=".65"/><circle cx="110" cy="122" r="24" fill={P.f} strokeWidth=".95"/><circle cx="110" cy="122" r="18" strokeWidth=".4" strokeDasharray="1.5 1.5"/>{[0,45,90,135,180,225,270,315].map(d=><path key={d} d="M110 122L105 106Q110 103 115 106Z" strokeWidth=".4" fill={P.f} transform={`rotate(${d} 110 122)`}/>)}<path d="M110 94C88 84 70 96 74 112C86 112 102 104 110 94ZM110 94C132 84 150 96 146 112C134 112 118 104 110 94Z" fill={P.f} strokeWidth=".8"/><circle cx="110" cy="64" r="2.5" fill={P.s}/></>}
              {cat==='herb'&&<><line x1="110" y1="174" x2="110" y2="50" strokeWidth=".9"/><path d="M110 146C84 142 64 124 70 106C86 112 104 128 110 146ZM110 146C136 142 156 124 150 106C134 112 116 128 110 146ZM110 118C86 110 72 90 80 74C94 82 106 100 110 118ZM110 118C134 110 148 90 140 74C126 82 114 100 110 118ZM110 90C94 82 88 66 96 56C104 64 108 76 110 90ZM110 90C126 82 132 66 124 56C116 64 112 76 110 90Z" fill={P.f} strokeWidth=".8"/><path d="M110 56Q116 42 110 32Q104 42 110 56Z" fill={P.f} strokeWidth=".75"/></>}
              {cat==='flower'&&<><path d="M92 174C96 148 110 138 110 114M128 174C124 148 110 138 110 114" strokeWidth=".85"/><path d="M110 60C86 60 68 80 74 106C80 124 96 132 110 132C124 132 140 124 146 106C152 80 134 60 110 60Z" fill={P.f} strokeWidth=".9"/><path d="M110 70C92 74 82 94 90 112C96 122 110 126 110 126M110 70C128 74 138 94 130 112C124 122 110 126 110 126" strokeWidth=".75"/><path d="M90 88C100 78 120 78 130 88C124 106 96 106 90 88Z" fill={P.f} strokeWidth=".7"/><circle cx="110" cy="94" r="2.5" fill={P.s}/></>}
              {cat==='wood'&&<><path d="M76 170C92 158 103 138 104 108C104 82 86 66 70 62M144 170C128 158 117 138 116 108C116 82 134 66 150 62" strokeWidth=".9"/><line x1="110" y1="92" x2="110" y2="174" strokeWidth=".65"/><polygon points="110,44 123,68 110,92 97,68" fill={P.f} strokeWidth=".9"/><polygon points="110,50 118,68 110,86 102,68" strokeWidth=".45"/><circle cx="110" cy="68" r="1.8" fill={P.s}/></>}
            </g>
            <path className="a-tw1" fill={P.s} d="M72 44L73.2 48.2L77.5 49.5L73.2 50.8L72 55L70.8 50.8L66.5 49.5L70.8 48.2Z"/>
            <path className="a-tw2" fill={P.s} d="M148 44L149.2 48.2L153.5 49.5L149.2 50.8L148 55L146.8 50.8L142.5 49.5L146.8 48.2Z"/>
          </svg>
        </div>
      );
    };

    function App() {
      const [cards, setCards] = useState([]), [cur, setCur] = useState(null), [draw, setDraw] = useState(false);
      const [shw, setShw] = useState(false), [step, setStep] = useState(''), [lt, setLt] = useState(false);
      const [hist, setHist] = useState([]), [openH, setOpenH] = useState(false), [cp, setCp] = useState(false);
      const tRef = useRef([]);
      const clr = () => { tRef.current.forEach(clearTimeout); tRef.current = []; };

      const init = () => {
        clr();
        const a = [..._PAYLOAD];
        for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
        setCards(a.slice(0, 3)); setCur(null); setDraw(false); setStep(''); setShw(false); setCp(false);
      };

      useEffect(() => {
        init();
        try { const s = localStorage.getItem('waven_h'); if (s) setHist(JSON.parse(s)); } catch (e) {}
        return clr;
      }, []);

      const pick = (i) => {
        if (draw || !cards[i]) return;
        clr(); setDraw(true); setCur(null); setShw(false); setCp(false);
        const sel = cards[i]; setStep('prepare');
        tRef.current.push(
          setTimeout(() => setStep('inhale'), 1150),
          setTimeout(() => setStep('exhale'), 2350),
          setTimeout(() => {
            setCur(sel); setDraw(false); setStep('');
            const d = new Date(), ts = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            setHist(p => { const u = [{ ...sel, drawTime: ts, rid: Date.now() }, ...p].slice(0, 15); try { localStorage.setItem('waven_h', JSON.stringify(u)); } catch (e) {} return u; });
          }, 3600)
        );
      };

      const copy = () => {
        if (!cur) return;
        const txt = `\u3010WAVEN \u690d\u7269\u9999\u6c23\u6307\u5f15\u3011\n\ud83c\udf3f ${cur.name} (${cur.enName})\n\n\u2728 \u80fd\u91cf\u6307\u5f15\uff1a\n${cur.energy}\n\n\ud83d\udca7 \u9670\u5f71\u89ba\u5bdf\uff1a\n${cur.shadow}\n\n\ud83e\uddea \u9999\u6c23\u5171\u9cf4\u914d\u65b9\uff1a\n${cur.blend}\n\n\u2014\u2014 Follow your inner light \u00b7 WAVEN`;
        const ok = () => { setCp(true); tRef.current.push(setTimeout(() => setCp(false), 2500)); };
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok);
        else { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); ok(); }
      };

      return (
        <div className={`min-h-[100dvh] font-serif flex flex-col items-center justify-between py-6 px-3.5 relative overflow-x-hidden transition-colors duration-1000 ${lt?'bg-[#F3ECE0] text-stone-800':'bg-[#070503] text-amber-50'}`}>
          <div className={`fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] opacity-95 pointer-events-none ${lt?'from-[#FFFDF9] via-[#F3ECE0] to-[#E2D6C1]':'from-[#22160a] via-[#090604] to-[#030201]'}`}/>
          <div className="fixed inset-0 bg-noise opacity-5 pointer-events-none"/>

          <div className="w-full max-w-[420px] mx-auto flex flex-col flex-1 justify-between z-10">
            <header className="w-full flex justify-between items-center mb-6 shrink-0">
              <button onClick={() => setLt(!lt)} className={`px-3.5 py-2 rounded-full border flex items-center gap-1.5 text-xs tracking-widest ${lt?'bg-[#FAF6EE]/90 border-amber-800/30 text-stone-700':'bg-[#150f09]/90 border-amber-500/30 text-amber-200/85'}`}>
                <Icon d={lt?<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>:<><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></>} c="w-3.5 h-3.5"/>
                <span>{lt?'\u5fae\u5149\u591c\u91d1':'\u6668\u5149\u4e9e\u9ebb'}</span>
              </button>
              <div className="flex flex-col items-center">
                <div className={`text-2xl font-display tracking-[0.28em] font-bold ${lt?'text-stone-800':'gold-txt'}`}>WAVEN</div>
                <span className={`text-[9px] font-italicSerif italic tracking-[0.35em] ${lt?'text-amber-900/60':'text-amber-400/60'}`}>Botanical Oracle</span>
              </div>
              <button onClick={() => setOpenH(true)} className={`px-3.5 py-2 rounded-full border flex items-center gap-1.5 text-xs tracking-widest relative ${lt?'bg-[#FAF6EE]/90 border-amber-800/30 text-stone-700':'bg-[#150f09]/90 border-amber-500/30 text-amber-200/85'}`}>
                <Icon d={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></>} c="w-3.5 h-3.5"/>
                <span>{'\u9999\u7c64\u7c3f'}</span>
              </button>
            </header>

            <main className="w-full flex-1 flex flex-col items-center justify-center my-auto">
              {!cur && !draw && (
                <div className="text-center space-y-6 a-fade w-full py-2">
                  <div className="space-y-2">
                    <p className={`text-[10px] font-display tracking-[0.38em] uppercase ${lt?'text-amber-800/70':'text-amber-400/70'}`}>Sacred Botanical Reading</p>
                    <h1 className="text-2xl tracking-[0.2em] font-normal">{'\u4eca\u65e5\u690d\u7269\u9999\u6c23\u6307\u5f15'}</h1>
                    <Divider c={`w-56 h-5 mx-auto ${lt?'text-amber-800/55':'text-amber-400/65'}`}/>
                  </div>
                  <p className={`poetic text-[13.5px] ${lt?'text-stone-600':'text-amber-100/75'}`}>{'\u8acb\u9589\u4e0a\u96d9\u773c\uff0c\u505a\u4e09\u6b21\u6df1\u9577\u800c\u7de9\u6162\u7684\u547c\u5438\n\u60f3\u50cf\u8d70\u9032\u7030\u6f2b\u82ac\u82b3\u7684\u82b1\u623f\uff0c\u6191\u76f4\u89ba\u8f15\u89f8\u4e00\u5f35\u756b\u724c'}</p>
                  <div className="grid grid-cols-3 gap-3.5 pt-3 pb-4 px-1 w-full">
                    {['sun','moon','star'].map((t, i) => (
                      <button key={t} onClick={() => pick(i)} className={`group relative w-full aspect-[3/5] rounded-t-[2.4rem] rounded-b-xl border transition-all duration-700 flex items-center justify-center p-2 overflow-hidden ${i===0?'-rotate-2 translate-y-1.5':i===2?'rotate-2 translate-y-1.5':''} hover:rotate-0 hover:-translate-y-2.5 ${lt?'bg-gradient-to-b from-[#FFFDF9] via-[#F7EFE0] to-[#E8DAC2] border-amber-800/35 shadow-lg':'bg-gradient-to-b from-[#1c1308] via-[#110b05] to-[#080503] border-amber-500/35 shadow-2xl'}`}>
                        <div className="absolute inset-0 bg-noise opacity-15 pointer-events-none"/><div className="absolute inset-0 sweep pointer-events-none"/>
                        <CardBack type={t} c={`w-full h-full transition-transform duration-700 group-hover:scale-105 ${lt?'text-amber-800/80':'text-amber-400/85'}`}/>
                      </button>
                    ))}
                  </div>
                  <div className="pt-4 border-t border-amber-500/15 w-full flex justify-center">
                    <a href={LINE_URL} target="_blank" rel="noopener noreferrer" className={`inline-flex items-center gap-2 py-1.5 px-4 text-xs tracking-[0.16em] ${lt?'text-stone-600 hover:text-amber-900':'text-amber-200/75 hover:text-amber-100'}`}>
                      <Icon d={<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>} c="w-3.5 h-3.5"/>
                      <span>{'\u66f4\u591a\u7591\u554f\u6b61\u8fce\u7dda\u4e0a\u8a62\u554f'}</span>
                    </a>
                  </div>
                </div>
              )}

              {draw && <Distiller step={step} lt={lt}/>}

              {cur && (
                <div className="w-full a-reveal space-y-5 pb-8 relative">
                  <p className={`text-xs italic tracking-[0.14em] flex items-center justify-center gap-1.5 ${lt?'text-amber-900/80':'text-amber-300/85'}`}>
                    <span>✦ {META[cur.category].h}</span>
                  </p>
                  <div className={`relative rounded-t-[3.5rem] rounded-b-3xl overflow-hidden border p-3 backdrop-blur-xl bg-gradient-to-b ${lt?META[cur.category].lt:META[cur.category].dk}`}>
                    <div className="absolute inset-0 bg-noise opacity-15 pointer-events-none"/>
                    <div className={`relative z-10 rounded-t-[2.8rem] rounded-b-2xl border px-4 py-6 ${lt?'border-amber-800/30 bg-white/55':'border-amber-400/30 bg-[#090603]/55'}`}>
                      <Corner c={`w-10 h-10 absolute top-3 left-3 ${lt?'text-amber-800/60':'text-amber-400/65'}`}/>
                      <Corner c={`w-10 h-10 absolute top-3 right-3 rotate-90 ${lt?'text-amber-800/60':'text-amber-400/65'}`}/>
                      <Corner c={`w-10 h-10 absolute bottom-3 left-3 -rotate-90 ${lt?'text-amber-800/60':'text-amber-400/65'}`}/>
                      <Corner c={`w-10 h-10 absolute bottom-3 right-3 rotate-180 ${lt?'text-amber-800/60':'text-amber-400/65'}`}/>

                      <div className={`text-center pb-5 border-b ${lt?'border-amber-800/15':'border-amber-500/15'}`}>
                        <span className={`text-[10px] font-display tracking-[0.22em] uppercase px-3.5 py-0.5 rounded-full border ${lt?'bg-[#FAF3E3] border-amber-800/25 text-amber-950':'bg-[#1a1208] border-amber-400/30 text-amber-200'}`}>
                          NO. {String(cur.id).padStart(2,'0')} · {META[cur.category].t}
                        </span>
                        <Medallion cat={cur.category} lt={lt}/>
                        <h2 className={`text-3xl tracking-[0.2em] font-medium mt-1 ${lt?'text-stone-800':'gold-txt'}`}>{cur.name}</h2>
                        <p className={`text-xs font-italicSerif italic tracking-[0.24em] mt-1 ${lt?'text-stone-500':'text-amber-200/75'}`}>{cur.enName}</p>
                        <p className={`text-[11px] mt-1.5 tracking-[0.12em] ${lt?'text-amber-900/75':'text-amber-400/75'}`}>✦ {META[cur.category].n} ✦</p>
                      </div>

                      <div className="py-6 space-y-6 text-center">
                        <div className="space-y-3.5">
                          <div className={`text-xs tracking-[0.26em] ${lt?'text-amber-900 font-medium':'text-amber-300'}`}>✦ {'\u690d\u7269\u80fd\u91cf\u6307\u5f15'} ✦</div>
                          <p className={`poetic text-[14.5px] ${lt?'text-stone-700':'text-amber-50/95'}`}>{cur.energy}</p>
                        </div>
                        <Divider c={`w-56 h-5 mx-auto ${lt?'text-amber-800/40':'text-amber-400/45'}`}/>
                        <div className="space-y-3">
                          <button onClick={() => setShw(!shw)} className={`w-full flex items-center justify-center gap-2 text-xs tracking-[0.2em] py-1.5 ${lt?'text-stone-600':'text-amber-300/90'}`}>
                            <span>{'\u5167\u5728\u9670\u5f71\u89ba\u5bdf\uff08\u9ede\u64ca\u5c55\u958b\uff09'}</span>
                            <Icon d={<path d={shw?"m18 15-6-6-6 6":"m6 9 6 6 6-6"}/>} c="w-3.5 h-3.5"/>
                          </button>
                          {shw && <div className={`py-4 px-3 rounded-xl border a-fade ${lt?'bg-[#FAF5E8]/90 border-amber-800/20 text-stone-700':'bg-[#080503]/75 border-amber-500/20 text-amber-100/90'}`}><p className="poetic text-[13.5px]">{cur.shadow}</p></div>}
                        </div>
                        <div className={`py-4 px-2.5 sm:px-4 rounded-xl border ${lt?'bg-[#FAF3E0] border-amber-800/25 text-stone-800':'bg-amber-950/35 border-amber-400/25 text-amber-100'}`}>
                          <div className={`text-xs tracking-[0.2em] mb-2 ${lt?'text-amber-900 font-medium':'text-amber-300'}`}>{'\u9999\u6c23\u5171\u9cf4\u914d\u65b9\u7b8b'}</div>
                          <p className={`whitespace-nowrap font-medium leading-relaxed ${cur.blend.length>22?'text-[11px] sm:text-[12.5px] tracking-tight':cur.blend.length>19?'text-[12px] sm:text-[13px] tracking-[0.03em]':'text-[13.5px] tracking-[0.08em]'}`}>{cur.blend}</p>
                        </div>
                        <div className={`pt-1 text-[11.5px] tracking-wider ${lt?'text-stone-500':'text-amber-400/65'}`}>
                          <div>{'\u82b3\u7642\u5e2b\u8cbc\u5fc3\u63d0\u9192'}</div>
                          <p className="mt-1 px-2">{cur.safety}</p>
                        </div>
                      </div>
                      <div className={`pt-4 border-t text-center text-[9px] font-display tracking-[0.38em] uppercase ${lt?'border-amber-800/15 text-stone-400':'border-amber-500/15 text-amber-500/40'}`}>Waven Botanical Oracle</div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3 pt-1">
                    <button onClick={copy} className={`flex items-center justify-center gap-2 py-3 px-4 rounded-full border text-xs tracking-[0.15em] ${lt?'bg-[#FAF6EE] border-amber-800/30 text-stone-800':'bg-[#150f09] border-amber-500/35 text-amber-200'}`}>
                      <span>{cp?'\u5df2\u6536\u5165\u526a\u8cbc\u7c3f':'\u73cd\u85cf\u4eca\u65e5\u9999\u7c64'}</span>
                    </button>
                    <button onClick={init} className={`flex items-center justify-center gap-2 py-3 px-4 rounded-full border text-xs tracking-[0.15em] ${lt?'bg-stone-800 border-stone-800 text-stone-50':'bg-amber-900/30 border-amber-400/45 text-amber-100'}`}>
                      <span>{'\u91cd\u65b0\u6d17\u724c'}</span>
                    </button>
                  </div>

                  <a href={LINE_URL} target="_blank" rel="noopener noreferrer" className={`group relative w-full p-4 rounded-2xl border flex items-center justify-between overflow-hidden ${lt?'bg-[#FAF6EE]/95 border-amber-800/25':'bg-gradient-to-br from-[#1a1209]/95 to-[#100b06]/95 border-amber-500/30'}`}>
                    <div className="absolute inset-0 sweep pointer-events-none"/>
                    <div className="flex items-center gap-3.5 relative z-10">
                      <div className={`p-3 rounded-full border ${lt?'bg-amber-50 border-amber-700/25 text-amber-800':'bg-amber-950/60 border-amber-400/30 text-amber-300'}`}>
                        <Icon d={<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>}/>
                      </div>
                      <div className="text-left">
                        <div className={`text-xs sm:text-sm font-medium tracking-[0.16em] ${lt?'text-stone-800':'text-amber-100'}`}>{'\u66f4\u591a\u7591\u554f\u6b61\u8fce\u7dda\u4e0a\u8a62\u554f'}</div>
                        <div className={`text-[11px] tracking-wider mt-0.5 ${lt?'text-stone-500':'text-amber-400/65'}`}>{'\u52a0\u5165 WAVEN \u5b98\u65b9 LINE \u8207\u6211\u5011\u804a\u804a'}</div>
                      </div>
                    </div>
                    <Icon d={<><path d="M7 7h10v10"/><path d="M7 17 17 7"/></>} c={`w-4 h-4 ${lt?'text-amber-800/60':'text-amber-400/70'}`}/>
                  </a>
                </div>
              )}
            </main>
          </div>

          {openH && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/65 backdrop-blur-sm a-fade">
              <div className={`w-full max-w-[360px] h-full p-6 flex flex-col justify-between overflow-y-auto border-l ${lt?'bg-[#FAF6EE] border-stone-300 text-stone-800':'bg-[#0d0906] border-amber-500/25 text-amber-50'}`}>
                <div className="space-y-5">
                  <div className="flex items-center justify-between pb-4 border-b border-amber-500/20">
                    <span className="tracking-[0.2em] text-base">{'\u500b\u4eba\u9999\u7c64\u7c3f'}</span>
                    <button onClick={() => setOpenH(false)} className="p-1.5"><Icon d={<path d="M18 6 6 18M6 6l12 12"/>}/></button>
                  </div>
                  {hist.length === 0 ? <p className="text-center py-12 text-xs tracking-widest opacity-50">{'\u5c1a\u7121\u62bd\u724c\u7d00\u9304'}</p> : (
                    <div className="space-y-3">
                      {hist.map(it => (
                        <button key={it.rid} onClick={() => { setCur(it); setShw(false); setOpenH(false); }} className={`w-full text-left p-4 rounded-xl border flex items-center justify-between ${lt?'bg-white border-stone-200':'bg-[#16100a] border-amber-500/20'}`}>
                          <div className="pr-2 truncate"><div className="font-medium">{it.name} <span className="text-[10px] italic opacity-50">{it.enName}</span></div><p className="text-xs mt-1 truncate opacity-65">{it.blend}</p></div>
                          <span className="text-[10px] font-mono opacity-45 shrink-0">{it.drawTime}</span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>
                {hist.length > 0 && <button onClick={() => { setHist([]); try { localStorage.removeItem('waven_h'); } catch (e) {} }} className="mt-6 w-full py-2.5 text-xs tracking-widest border border-amber-500/20 rounded-lg opacity-60 hover:opacity-100">{'\u6e05\u7a7a\u672c\u6a5f\u9999\u7c64\u7d00\u9304'}</button>}
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
