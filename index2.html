<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>WAVEN 植物香氣指引</title>
  <script src="./assets/vendor/tailwind-3.4.17.js"></script>
  <link rel="stylesheet" href="./assets/fonts/fonts.css">
  <script src="./assets/vendor/react-18.3.1.min.js" crossorigin></script>
  <script src="./assets/vendor/react-dom-18.3.1.min.js" crossorigin></script>
  <script>
    tailwind.config={theme:{extend:{fontFamily:{serif:['"Noto Serif TC"','"Cormorant Garamond"','serif'],display:['"Cinzel Decorative"','serif'],italicSerif:['"Cormorant Garamond"','serif']}}}};
    document.addEventListener('contextmenu',e=>e.preventDefault());
    document.addEventListener('keydown',e=>{if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&['I','J','C'].includes(e.key))||(e.ctrlKey&&['u','U','s','S'].includes(e.key)))e.preventDefault()});
  </script>
  <style>
    html,body{overflow-x:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
    .poetic{white-space:pre-line;word-break:keep-all;line-height:2.2;letter-spacing:.08em}
    .bg-noise{background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
    .gold-txt{background:linear-gradient(135deg,#FFF5D6 0%,#D8B467 35%,#B88746 68%,#FBF0C9 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .sweep{background:linear-gradient(110deg,transparent 28%,rgba(235,197,125,.2) 50%,transparent 72%);background-size:200% 100%;transition:background-position 1.1s cubic-bezier(.19,1,.22,1);background-position:200% 0}
    .group:hover .sweep{background-position:-100% 0}
    @keyframes reveal{0%{opacity:0;transform:perspective(1400px) rotateX(4deg) translateY(20px) scale(.97);filter:blur(6px)}100%{opacity:1;transform:perspective(1400px) rotateX(0) translateY(0) scale(1);filter:blur(0)}}
    @keyframes draw{0%{stroke-dashoffset:900;opacity:0}20%{opacity:.9}100%{stroke-dashoffset:0;opacity:1}}
    @keyframes bloom{0%{transform:scale(.3) rotate(-15deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
    @keyframes swell{0%,10%,100%{transform:scale(.2);opacity:.2}28%{transform:scale(1.15,1.35);opacity:1}38%{transform:scale(.4,.6);opacity:.5}}
    @keyframes drop{0%,16%{transform:translateY(0) scale(.15);opacity:0}28%{transform:translateY(2px) scale(.88,1.12);opacity:1}66%{transform:translateY(58px) scale(.92,1.22);opacity:1}71%{transform:translateY(64px) scale(1.45,.35);opacity:.85}76%,100%{transform:translateY(66px) scale(1.8,.1);opacity:0}}
    @keyframes sat{0%,30%,76%,100%{transform:translateY(0) scale(0);opacity:0}38%{transform:translateY(4px) scale(1);opacity:.9}70%{transform:translateY(62px) scale(.8);opacity:.85}}
    @keyframes splash{0%,67%,90%,100%{transform:translateY(0) scale(0);opacity:0}74%{transform:translateY(-9px) scale(1);opacity:.95}84%{transform:translateY(-2px) scale(.75);opacity:.6}}
    @keyframes ripple{0%,66%{transform:scale(.15);opacity:0}72%{opacity:.95}100%{transform:scale(1.95);opacity:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes rspin{from{transform:rotate(360deg)}to{transform:rotate(0deg)}}
    @keyframes twinkle{0%,100%{transform:scale(.75);opacity:.25}50%{transform:scale(1.15);opacity:.95}}
    @keyframes prog{0%{width:0%}100%{width:100%}}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .a-reveal{animation:reveal 1.2s cubic-bezier(.16,1,.3,1) forwards}
    .a-draw{stroke-dasharray:900;animation:draw 2.8s cubic-bezier(.22,1,.36,1) forwards}
    .a-bloom{transform-origin:130px 118px;animation:bloom 2.4s cubic-bezier(.22,1,.36,1) .1s forwards;opacity:0}
    .a-swell{transform-origin:130px 124px;animation:swell 2.4s cubic-bezier(.4,0,.2,1) infinite}
    .a-drop{transform-origin:130px 128px;animation:drop 2.4s cubic-bezier(.55,.05,.68,.19) infinite}
    .a-sat{transform-origin:130px 126px;animation:sat 2.4s cubic-bezier(.55,.05,.68,.19) infinite}
    .a-splash{transform-origin:130px 192px;animation:splash 2.4s cubic-bezier(.22,1,.36,1) infinite}
    .a-rip1{transform-origin:130px 192px;animation:ripple 2.4s cubic-bezier(.16,1,.3,1) infinite}
    .a-rip2{transform-origin:130px 192px;animation:ripple 2.4s cubic-bezier(.16,1,.3,1) .16s infinite}
    .a-rip3{transform-origin:130px 192px;animation:ripple 2.4s cubic-bezier(.16,1,.3,1) .32s infinite}
    .a-spin{animation:spin 48s linear infinite}.a-rspin{animation:rspin 36s linear infinite}
    .a-tw1{animation:twinkle 3s ease-in-out infinite}.a-tw2{animation:twinkle 3.8s ease-in-out 1.2s infinite}.a-tw3{animation:twinkle 3.4s ease-in-out 2.1s infinite}
    .a-prog{animation:prog 3.6s cubic-bezier(.22,1,.36,1) forwards}.a-fade{animation:fade .5s ease-out forwards}
  </style>
</head>
<body class="m-0 p-0 selection:bg-amber-500/30 selection:text-amber-100">
  <div id="root"></div>
  <script src="./assets/aroma.min.js"></script>
</body>
</html>
